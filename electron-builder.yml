appId: com.excloud.dbconsole
productName: DBConsole
directories:
  output: dist/electron-build
  app: dist/electron/app
files:
  - electron/**
  - build-info.json
  - ipc.cjs
extraResources:
  - from: dist/renderer
    to: renderer
  - from: dist/electron/native
    to: native
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
