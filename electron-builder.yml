appId: com.excloud.dbconsole
productName: DBConsole
directories:
  output: dist/electron-build
files:
  - electron/**
  - package.json
  - dist/electron/build-info.json
  - dist/electron/ipc.cjs
  - dist/electron/ipc.cjs.map
extraResources:
  - from: dist/renderer
    to: renderer
  - from: dist/electron/native
    to: native
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
