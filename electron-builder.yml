appId: com.excloud.dbconsole
productName: DBConsole
directories:
  output: dist/electron-build
  app: dist/electron/app
files:
  - electron/**
  - build-info.json
  - ipc.cjs
fileAssociations:
  - ext: sql
    name: SQL File
    description: SQL script
    role: Editor
extraResources:
  - from: dist/renderer
    to: renderer
  - from: dist/electron/native
    to: native
asar: true
mac:
  category: public.app-category.developer-tools
  icon: assets/icons/dbconsole.icns
  target:
    - dmg
