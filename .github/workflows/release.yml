name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Assert arm64 runner
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "${arch}" != "arm64" ]; then
            echo "Expected arm64 runner, got: ${arch}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build desktop artifacts (arm64)
        run: npm run electron:dist:mac -- --arm64

      - name: Extract release notes from CHANGELOG
        run: node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/electron-build/*.dmg
            dist/electron-build/*.dmg.blockmap
            dist/electron-build/latest-mac.yml
