name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Assert arm64 runner
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "${arch}" != "arm64" ]; then
            echo "Expected arm64 runner, got: ${arch}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build desktop artifacts (arm64)
        run: npm run electron:dist:mac -- --arm64

      - name: Extract release notes from CHANGELOG
        run: node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}"

      - name: Append SHA256 checksums (for updater verification)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(dist/electron-build/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No DMG artifacts found in dist/electron-build" >&2
            exit 1
          fi

          {
            echo ""
            echo "---"
            echo "SHA256 checksums:"
            for dmg in "${dmgs[@]}"; do
              file="$(basename "$dmg")"
              hash="$(shasum -a 256 "$dmg" | awk '{print $1}')"
              echo "${hash}  ${file}"
            done
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/electron-build/*.dmg
            dist/electron-build/*.dmg.blockmap
            dist/electron-build/latest-mac.yml
